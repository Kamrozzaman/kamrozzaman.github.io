{% if site.data.profile.collaborators %}
<div class="card my-3 p-0 bg-white border-0 shadow-sm">
    <h6 class="border-bottom border-gray p-3 mb-0">
        Research Collaborations
    </h6>
    <div class="card-body">
        <div class="row">
            {% for item in site.data.profile.collaborators %}
            <div class="col-md-6 mb-3">
                <div>
                    <a href="{{ item.url }}" target="_blank"><strong>{{ item.name }}</strong></a>
                    {% if item.scholar %}<a href="{{ item.scholar }}" target="_blank" title="Google Scholar" class="ml-1"><i class="ai ai-google-scholar"></i></a>{% endif %}
                </div>
                <div class="small">{{ item.position }}</div>
                <div class="small text-muted">{{ item.affiliation }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endif %}
