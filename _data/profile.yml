short_bio: >-
  <p>
    I am a <strong>Senior Software Engineer</strong> at <a href="https://enosisbd.com/" target="_blank">Enosis Solutions</a>, Dhaka,
    where I build production C++ and C# software for an enterprise accounting platform used by businesses across North America.
    My current focus is <strong>AI-driven development</strong>: I use agentic coding tools such as
    <em>Claude Code</em>, <em>OpenAI Codex</em> and <em>GitHub Copilot</em> every day, and build agentic workflows
    that make development, debugging and code review more productive on a large legacy codebase.
    I received my B.Sc. in Computer Science and Engineering from
    <a href="https://www.aust.edu/" target="_blank">Ahsanullah University of Science and Technology (AUST)</a>
    with a CGPA of 3.814/4.00 (rank 6 of 123), and received the Dean's Award for Academic Excellence.
  </p>
  <p>
    My research interests are <em>Generative AI</em>, <em>Large Language Models</em>, and <em>Software Engineering</em>.
    I have co-authored work on generative models for Bengali handwriting, detection of AI-generated images, text, and audio,
    and NLP for low-resource languages, published at ICCIT.
    More recently, I have been working on <em>transfer learning for tabular data</em> with transformers and LLM fine-tuning,
    aimed at domains that share no common features.
    Before that I spent a lot of time on competitive programming: I am a Codeforces <strong>Expert</strong> (max 1644),
    a CodeChef <strong>4★</strong> (max 1840), and participated twice in the ICPC Dhaka Regional.
  </p>

